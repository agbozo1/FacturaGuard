[project]
name = "facturaguard"
version = "0.1.0"
description = "AI copilot that checks Romanian e-Factura invoices before ANAF rejects them"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openai>=1.50",
  "pydantic-settings>=2.4",
  "lxml>=5.2",
  "saxonche>=12.5",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["facturaguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
